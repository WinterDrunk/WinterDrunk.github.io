<style>
    .cam-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .cam-card { background: #111927; border: 1px solid #1a2a3a; border-radius: 4px; padding: 24px 20px; text-align: center; text-decoration: none; color: inherit; transition: 0.25s; min-height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .cam-card:hover { border-color: #00e87a; transform: translateY(-2px); }
    .cam-card .icon { font-size: 40px; }
    .cam-card h3 { margin-top: 8px; font-size: 16px; font-weight: 500; color: #c8d8e8; }
    .cam-card .count { font-size: 12px; color: #5a7a8a; margin-top: 4px; }
    .cam-card .badge { display: inline-block; padding: 2px 16px; border-radius: 2px; font-size: 10px; letter-spacing: 1px; margin-top: 8px; border: 1px solid #1a2a3a; color: #5a7a8a; }
    .cam-regions { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 16px 0; }
    .cam-region { background: #0d1420; border: 1px solid #1a2a3a; border-radius: 2px; padding: 10px; text-decoration: none; color: #c8d8e8; text-align: center; transition: 0.2s; }
    .cam-region:hover { border-color: #00c8ff; }
    .cam-region .r-emoji { font-size: 20px; display: block; }
    .cam-region .r-name { font-size: 12px; margin-top: 2px; }
    .cam-region .r-count { font-size: 9px; color: #5a7a8a; }
    .cam-note { margin-top: 16px; font-size: 11px; color: #5a7a8a; border-top: 1px solid #1a2a3a; padding-top: 12px; text-align: center; letter-spacing: 1px; }
    .cam-note a { color: #00c8ff; text-decoration: none; }
    .section-title { font-size: 14px; font-weight: 300; letter-spacing: 2px; color: #5a7a8a; margin: 16px 0 10px; border-bottom: 1px solid #1a2a3a; padding-bottom: 6px; }
    @media (max-width: 768px) { .cam-grid { grid-template-columns: 1fr; } .cam-regions { grid-template-columns: 1fr 1fr 1fr; } }
    @media (max-width: 480px) { .cam-regions { grid-template-columns: 1fr 1fr; } }
</style>
