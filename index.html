<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drunk·Winter 星空暗流</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            color: #e0e0e0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: 34px;
            font-weight: 300;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #f0f0f0 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .sub {
            font-size: 14px;
            color: #555;
            letter-spacing: 4px;
            margin-top: 4px;
        }
        .header .badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            color: #4caf50;
            border: 1px solid #1a3a2a;
            padding: 4px 18px;
            border-radius: 20px;
            letter-spacing: 2px;
            background: #0d1a12;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tabs button {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        .tabs button:hover {
            border-color: #444;
            color: #ccc;
        }
        .tabs button.active {
            background: #1a1a1a;
            border-color: #555;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.02);
        }
        .panel-container {
            animation: fadeIn 0.3s ease;
            min-height: 400px;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #222;
            border-top: 1px solid #111;
            padding-top: 20px;
            letter-spacing: 2px;
        }
        .loading {
            color: #555;
            text-align: center;
            padding: 60px 0;
            font-size: 14px;
            letter-spacing: 2px;
        }
        @media (max-width: 500px) {
            .header h1 {
                font-size: 24px;
                letter-spacing: 4px;
            }
            .tabs button {
                padding: 4px 10px;
                font-size: 10px;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⬛ Drunk·Winter 星空暗流</h1>
            <div class="sub">by the Water · 聚合工具平台</div>
            <div class="badge">● 运行中</div>
        </div>

        <div class="tabs" id="navTabs">
            <button class="active" data-page="tools">🛠 工具</button>
            <button data-page="monitor">📡 回响</button>
            <button data-page="osint">🕵️ 情报引擎</button>
            <button data-page="recon">🚀 自动侦查</button>
            <button data-page="space">🛰️ 太空域</button>
            <button data-page="star">🔭 专业星图</button>
            <button data-page="camera">📷 全球摄像头</button>
        </div>

        <div class="panel-container" id="panelContainer">
            <div class="loading">⏳ 加载中...</div>
        </div>

        <div class="footer">⬛ Drunk·Winter · 自留地</div>
    </div>

    <script>
        const container = document.getElementById('panelContainer');
        const tabs = document.querySelectorAll('#navTabs button');

        function loadPage(page) {
            container.innerHTML = '<div class="loading">⏳ 加载 ' + page + ' ...</div>';
            fetch(page + '.html')
                .then(res => {
                    if (!res.ok) throw new Error('页面不存在');
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    // 重新执行脚本（如果有）
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        document.body.appendChild(newScript);
                        oldScript.remove();
                    });
                })
                .catch(err => {
                    container.innerHTML = '<div style="color:#666;text-align:center;padding:60px 0;">⚠️ 加载失败: ' +
                        err.message + '</div>';
                });
        }

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const page = btn.dataset.page;
                loadPage(page);
                // 更新URL hash
                window.location.hash = page;
            });
        });

        // 初始加载：从 hash 或默认 tools
        const initPage = window.location.hash.replace('#', '') || 'tools';
        const activeBtn = document.querySelector(`#navTabs button[data-page="${initPage}"]`);
        if (activeBtn) {
            activeBtn.classList.add('active');
            tabs.forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
            loadPage(initPage);
        } else {
            loadPage('tools');
        }

        // 监听 hash 变化
        window.addEventListener('hashchange', () => {
            const page = window.location.hash.replace('#', '') || 'tools';
            const btn = document.querySelector(`#navTabs button[data-page="${page}"]`);
            if (btn) {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadPage(page);
            }
        });
    </script>
</body>
</html>
