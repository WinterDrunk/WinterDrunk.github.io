<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drunk·Winter 暗域</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0a0e17; }
        ::-webkit-scrollbar-thumb { background: #1a2a3a; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a3a4a; }

        body {
            background: #0a0e17;
            min-height: 100vh;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            color: #c8d8e8;
            padding: 32px 24px;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
            border-bottom: 1px solid #1a2a3a;
            padding-bottom: 18px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #00e87a 0%, #00c8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }
        .header .sub {
            font-size: 12px;
            color: #5a7a8a;
            letter-spacing: 6px;
            margin-top: 4px;
            font-weight: 300;
        }
        .header .badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 10px;
            color: #00e87a;
            border: 1px solid #0a2a1a;
            padding: 2px 16px;
            border-radius: 2px;
            letter-spacing: 3px;
            background: #0a1a12;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            border-bottom: 1px solid #1a2a3a;
            padding-bottom: 2px;
        }
        .tabs button {
            background: transparent;
            border: none;
            color: #5a7a8a;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1.5px;
            font-family: inherit;
            border-bottom: 2px solid transparent;
            text-transform: uppercase;
        }
        .tabs button:hover {
            color: #c8d8e8;
            background: rgba(0, 232, 122, 0.04);
        }
        .tabs button.active {
            color: #00e87a;
            border-bottom-color: #00e87a;
            background: rgba(0, 232, 122, 0.06);
        }
        .panel-container {
            animation: fadeIn 0.25s ease;
            min-height: 400px;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 10px;
            color: #1a2a3a;
            border-top: 1px solid #0a1a1a;
            padding-top: 16px;
            letter-spacing: 4px;
            font-weight: 300;
        }
        .loading {
            color: #5a7a8a;
            text-align: center;
            padding: 60px 0;
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: 300;
        }
        .loading::after {
            content: '...';
            animation: dots 1.2s steps(4) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        @media (max-width: 768px) {
            body { padding: 20px 12px; }
            .header h1 { font-size: 22px; letter-spacing: 4px; }
            .tabs button { font-size: 10px; padding: 6px 12px; letter-spacing: 0.5px; }
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 18px; letter-spacing: 2px; }
            .tabs button { font-size: 9px; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⧩ 暗 域</h1>
            <div class="sub">DRUNK · WINTER · 星空暗流</div>
            <div class="badge">● 运行中</div>
        </div>
        <div class="tabs" id="navTabs">
            <button data-page="console">⌨️ 控制台</button>
            <button data-page="tools">🛠 工具</button>
            <button data-page="monitor">📡 回响</button>
            <button data-page="osint">🕵️ 情报</button>
            <button data-page="recon">🚀 侦查</button>
            <button data-page="space">🛰️ 太空</button>
            <button data-page="star">🔭 星图</button>
            <button data-page="camera">📷 全球眼</button>
        </div>
        <div class="panel-container" id="panelContainer">
            <div class="loading">⏳ 加载</div>
        </div>
        <div class="footer">⧩ 暗域 · 自留地</div>
    </div>
    <script>
        var container = document.getElementById('panelContainer');
        var tabs = document.querySelectorAll('#navTabs button');
        var currentPage = '';

        function loadPage(page) {
            if (page === currentPage) return;
            currentPage = page;
            var fileName = page + '.html';
            container.innerHTML = '<div class="loading">⏳ 加载 ' + page + '</div>';
            var oldScripts = document.querySelectorAll('.dynamic-script');
            oldScripts.forEach(function(s) { s.remove(); });
            fetch(fileName)
                .then(function(res) {
                    if (!res.ok) throw new Error('404');
                    return res.text();
                })
                .then(function(html) {
                    container.innerHTML = html;
                    var match = html.match(/<script>([\s\S]*?)<\/script>/);
                    if (match) {
                        var script = document.createElement('script');
                        script.className = 'dynamic-script';
                        script.textContent = match[1];
                        document.body.appendChild(script);
                    }
                })
                .catch(function(err) {
                    container.innerHTML = '<div style="color:#ff6a00;text-align:center;padding:60px 0;font-size:14px;letter-spacing:2px;">⚠️ 加载失败: ' + err.message + '<br><span style="color:#5a7a8a;font-size:12px;">文件不存在</span></div>';
                });
        }

        // 默认加载控制台
        var initPage = window.location.hash.replace('#', '') || 'console';
        var activeBtn = document.querySelector('#navTabs button[data-page="' + initPage + '"]');
        if (activeBtn) {
            tabs.forEach(function(b) { b.classList.remove('active'); });
            activeBtn.classList.add('active');
            loadPage(initPage);
        } else {
            document.querySelector('#navTabs button[data-page="console"]').classList.add('active');
            loadPage('console');
        }

        tabs.forEach(function(btn) {
            btn.addEventListener('click', function() {
                tabs.forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                var page = btn.dataset.page;
                loadPage(page);
                window.location.hash = page;
            });
        });

        window.addEventListener('hashchange', function() {
            var page = window.location.hash.replace('#', '') || 'console';
            var btn = document.querySelector('#navTabs button[data-page="' + page + '"]');
            if (btn) {
                tabs.forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                loadPage(page);
            }
        });
    </script>
</body>
</html>
