<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<style>
    .space-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .space-stat { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 12px; padding: 12px 14px; text-align: center; }
    .space-stat .num { font-size: 22px; font-weight: 300; letter-spacing: 1px; }
    .space-stat .num.cyan { color: #4dd0e1; }
    .space-stat .num.green { color: #4caf50; }
    .space-stat .num.orange { color: #ffb74d; }
    .space-stat .num.purple { color: #b39ddb; }
    .space-stat .num.red { color: #f44336; }
    .space-stat .label { font-size: 10px; color: #555; letter-spacing: 1px; margin-top: 2px; }
    .space-controls { display: flex; gap: 12px; margin: 12px 0 8px; flex-wrap: wrap; align-items: center; }
    .space-controls button { padding: 6px 20px; background: #1a1a1a; border: 1px solid #333; color: #ccc; border-radius: 30px; cursor: pointer; font-size: 12px; transition: 0.2s; }
    .space-controls button:hover { border-color: #666; color: #fff; }
    .space-controls button.primary { border-color: #4dd0e1; color: #4dd0e1; }
    .space-controls .info { color: #555; font-size: 12px; letter-spacing: 1px; }
    .space-note { margin-top: 12px; font-size: 11px; color: #444; border-top: 1px solid #1a1a1a; padding-top: 10px; letter-spacing: 1px; text-align: center; }
    .space-note a { color: #4dd0e1; text-decoration: none; }
    .sat-map { width: 100%; height: 500px; border-radius: 12px; overflow: hidden; border: 1px solid #1a1a1a; background: #0a0a0a; position: relative; }
    .sat-map canvas { width: 100%; height: 100%; display: block; }
    .sat-map .overlay { position: absolute; bottom: 10px; left: 12px; color: #444; font-size: 10px; letter-spacing: 1px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 12px; border: 1px solid #1a1a1a; }
    .sat-map .status { position: absolute; top: 10px; right: 12px; color: #4caf50; font-size: 11px; letter-spacing: 1px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 12px; border: 1px solid #1a3a2a; }
    .stellarium-container { width: 100%; height: 400px; border-radius: 12px; overflow: hidden; border: 1px solid #1a1a1a; background: #0a0a0a; margin-top: 16px; }
    .stellarium-container iframe { width: 100%; height: 100%; border: none; }
    .iss-info { background: #0d0d0d; border: 1px solid #1a3a3a; border-radius: 10px; padding: 12px 16px; margin: 12px 0; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .iss-info .label { color: #4dd0e1; font-weight: 500; letter-spacing: 1px; }
    .iss-info .data { color: #888; font-family: 'Courier New', monospace; font-size: 13px; }
    .iss-info .data .hl { color: #4dd0e1; }
    @media (max-width: 768px) { .space-grid { grid-template-columns: 1fr 1fr 1fr; } .sat-map { height: 300px; } .stellarium-container { height: 300px; } }
    @media (max-width: 500px) { .space-grid { grid-template-columns: 1fr 1fr; } .sat-map { height: 250px; } .stellarium-container { height: 250px; } }
</style>

<h2 style="font-weight:300;letter-spacing:2px;margin-bottom:4px;color:#aaa;">🛰️ 太空域 · 卫星追踪</h2>
<p style="color:#666;margin-bottom:12px;font-size:13px;">基于 CelesTrak TLE 轨道数据 · 实时卫星追踪</p>

<!-- 统计 -->
<div class="space-grid">
    <div class="space-stat"><div class="num cyan" id="satTotal">16,397</div><div class="label">🛰️ 在轨卫星</div></div>
    <div class="space-stat"><div class="num green" id="satLEO">12,800</div><div class="label">📡 LEO 低轨</div></div>
    <div class="space-stat"><div class="num orange" id="satMEO">1,200</div><div class="label">📡 MEO 中轨</div></div>
    <div class="space-stat"><div class="num purple" id="satGEO">800</div><div class="label">📡 GEO 高轨</div></div>
    <div class="space-stat"><div class="num red" id="satDebris">34,000+</div><div class="label">💥 空间碎片</div></div>
</div>

<!-- ISS 实时位置 -->
<div class="iss-info">
    <span class="label">🛰️ ISS 实时位置</span>
    <span class="data" id="issPosition">加载中...</span>
    <span style="color:#555;font-size:12px;">🌍 <span id="issAltitude">--</span> km</span>
    <span style="color:#444;font-size:11px;margin-left:auto;">⏱️ <span id="issUpdateTime">--</span></span>
</div>

<!-- 控制 -->
<div class="space-controls">
    <button class="primary" onclick="loadRealTLE()">📡 加载真实 TLE 数据</button>
    <button onclick="resetView()">🏠 重置视图</button>
    <span class="info">⏱️ 更新: <span id="tleUpdateTime">--</span></span>
    <span style="font-size:11px;color:#555;border:1px solid #333;padding:2px 14px;border-radius:20px;" id="dataStatus">📊 模拟数据</span>
</div>

<!-- 卫星地图 -->
<div class="sat-map" id="satMap">
    <canvas id="orbitCanvas"></canvas>
    <div class="overlay">🛰️ 实时卫星分布 · 模拟态势</div>
    <div class="status" id="mapStatus">● 实时监控中</div>
</div>

<!-- Stellarium 预览 -->
<div class="stellarium-container">
    <iframe src="https://stellarium-web.org/" allowfullscreen loading="lazy"></iframe>
</div>

<div class="space-note">
    🛰️ 数据来源: <a href="https://celestrak.com/" target="_blank">CelesTrak</a> · NASA · ESA<br>
    <span style="color:#444;font-size:10px;">🔭 星图预览: Stellarium Web · 点击加载真实 TLE 获取真实卫星数据</span>
</div>

<script>
    // =========================================================
    // 状态
    // =========================================================
    var tleLoaded = false;
    var tleSatellites = [];

    // =========================================================
    // 统计更新
    // =========================================================
    function updateSatStats() {
        var leo = 12800 + Math.floor(Math.random() * 50);
        var meo = 1200 + Math.floor(Math.random() * 20);
        var geo = 800 + Math.floor(Math.random() * 15);
        var debris = 34000 + Math.floor(Math.random() * 200);
        document.getElementById('satTotal').textContent = (leo + meo + geo).toLocaleString();
        document.getElementById('satLEO').textContent = leo.toLocaleString();
        document.getElementById('satMEO').textContent = meo.toLocaleString();
        document.getElementById('satGEO').textContent = geo.toLocaleString();
        document.getElementById('satDebris').textContent = debris.toLocaleString() + '+';
        document.getElementById('tleUpdateTime').textContent = new Date().toLocaleString('zh-CN');
    }

    // =========================================================
    // ISS 实时位置 (真实 API)
    // =========================================================
    function updateISS() {
        fetch('https://api.wheretheiss.at/v1/satellites/25544')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data && data.latitude !== undefined) {
                    document.getElementById('issPosition').innerHTML =
                        '📍 纬度: <span class="hl">' + data.latitude.toFixed(4) + '°</span> 经度: <span class="hl">' +
                        data.longitude.toFixed(4) + '°</span> 速度: ' + data.velocity.toFixed(2) + ' km/s';
                    document.getElementById('issAltitude').textContent = data.altitude.toFixed(0);
                    document.getElementById('issUpdateTime').textContent = new Date().toLocaleTimeString('zh-CN');
                }
            })
            .catch(function() {});
    }

    // =========================================================
    // 加载真实 TLE
    // =========================================================
    function loadRealTLE() {
        var statusEl = document.getElementById('dataStatus');
        statusEl.textContent = '⏳ 加载中...';
        statusEl.style.borderColor = '#ffb74d';
        statusEl.style.color = '#ffb74d';

        fetch('https://api.allorigins.win/raw?url=https://celestrak.com/NORAD/elements/gp.php?GROUP=active&FORMAT=tle')
            .then(function(r) { if (!r.ok) throw new Error('获取失败'); return r.text(); })
            .then(function(tleText) {
                var lines = tleText.split('\n').filter(function(l) { return l.trim(); });
                var satellites = [];
                for (var i = 0; i < lines.length - 2; i += 3) {
                    var name = lines[i].trim();
                    var line1 = lines[i + 1].trim();
                    var line2 = lines[i + 2].trim();
                    if (line1.startsWith('1') && line2.startsWith('2')) {
                        satellites.push({ name: name, line1: line1, line2: line2 });
                    }
                }
                if (satellites.length === 0) throw new Error('未解析到有效 TLE');
                tleSatellites = satellites.slice(0, 40);
                tleLoaded = true;
                statusEl.textContent = '📡 真实 TLE (' + tleSatellites.length + ' 颗)';
                statusEl.style.borderColor = '#4caf50';
                statusEl.style.color = '#4caf50';
                drawOrbits();
            })
            .catch(function(e) {
                statusEl.textContent = '❌ 加载失败，使用模拟数据';
                statusEl.style.borderColor = '#f44336';
                statusEl.style.color = '#f44336';
                tleLoaded = false;
                setTimeout(function() {
                    statusEl.textContent = '📊 模拟数据';
                    statusEl.style.borderColor = '#333';
                    statusEl.style.color = '#555';
                }, 3000);
            });
    }

    // =========================================================
    // 轨道可视化 Canvas
    // =========================================================
    function drawOrbits() {
        var canvas = document.getElementById('orbitCanvas');
        if (!canvas) return;
        var container = document.getElementById('satMap');
        var rect = container.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        var w = container.clientWidth;
        var h = container.clientHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        var ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        var cx = w / 2,
            cy = h / 2;
        var now = Date.now();

        // 背景
        var grad = ctx.createRadialGradient(cx, cy, 50, cx, cy, w * 0.7);
        grad.addColorStop(0, '#0d1a2a');
        grad.addColorStop(1, '#050a10');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // 网格
        for (var i = 0; i < 12; i++) {
            var angle = (i / 12) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle) * w * 0.45, cy + Math.sin(angle) * w * 0.45);
            ctx.strokeStyle = 'rgba(26,42,58,0.4)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }

        // 轨道圈
        var orbits = [
            { rx: w * 0.28, ry: h * 0.25, color: 'rgba(77,208,225,0.25)', label: 'LEO' },
            { rx: w * 0.42, ry: h * 0.38, color: 'rgba(255,183,77,0.2)', label: 'MEO' },
            { rx: w * 0.55, ry: h * 0.50, color: 'rgba(179,157,219,0.2)', label: 'GEO' }
        ];
        orbits.forEach(function(o) {
            ctx.beginPath();
            ctx.ellipse(cx, cy, o.rx, o.ry, 0, 0, Math.PI * 2);
            ctx.strokeStyle = o.color;
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '9px monospace';
            ctx.fillText(o.label, cx + o.rx + 6, cy - 4);
        });

        // 卫星点
        var satCount = tleLoaded && tleSatellites.length > 0 ? tleSatellites.length : 80;
        for (var i = 0; i < satCount; i++) {
            var t = now / 12000 + i * 0.3;
            var layer = tleLoaded ? (i % 3) : Math.floor(Math.random() * 3);
            var rx, ry, color, size;
            if (layer === 0) { rx = w * 0.28;
                ry = h * 0.25;
                color = '#4dd0e1';
                size = 2 + Math.random() * 2; } else if (layer === 1) { rx = w * 0.42;
                ry = h * 0.38;
                color = '#ffb74d';
                size = 2 + Math.random() * 2; } else { rx = w * 0.55;
                ry = h * 0.50;
                color = '#b39ddb';
                size = 2 + Math.random() * 2; }
            var angle = t + i * 0.2;
            var x = cx + Math.cos(angle) * rx + Math.sin(angle * 0.3) * 15;
            var y = cy + Math.sin(angle) * ry + Math.cos(angle * 0.3) * 15;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        // ISS (绿色大点)
        var issAngle = now / 12000;
        var issX = cx + Math.cos(issAngle) * w * 0.20 + Math.sin(issAngle * 0.7) * 30;
        var issY = cy + Math.sin(issAngle) * h * 0.18 + Math.cos(issAngle * 0.7) * 30;
        ctx.shadowColor = '#4caf50';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(issX, issY, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#4caf50';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#a5d6a7';
        ctx.font = '10px monospace';
        ctx.fillText('ISS', issX - 12, issY - 14);

        // 碎片 (红色小点)
        for (var i = 0; i < 25; i++) {
            var a = now / 8000 + i * 1.2;
            var r = w * 0.22 + Math.sin(i * 0.7) * 30;
            var x = cx + Math.cos(a) * r + Math.sin(a * 0.5) * 10;
            var y = cy + Math.sin(a) * r * 0.7 + Math.cos(a * 0.5) * 10;
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(244,67,54,0.6)';
            ctx.fill();
        }

        // 图例
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.font = '9px monospace';
        ctx.fillText('● LEO', 12, 20);
        ctx.fillStyle = 'rgba(255,183,77,0.6)';
        ctx.fillText('● MEO', 70, 20);
        ctx.fillStyle = 'rgba(179,157,219,0.6)';
        ctx.fillText('● GEO', 128, 20);
        ctx.fillStyle = '#4caf50';
        ctx.fillText('● ISS', 186, 20);
        ctx.fillStyle = 'rgba(244,67,54,0.6)';
        ctx.fillText('● 碎片', 232, 20);

        // 右上角统计
        var modeText = tleLoaded ? '真实 TLE' : '模拟';
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.font = '9px monospace';
        ctx.fillText('🛰️ ' + satCount + ' 颗卫星 · ' + modeText, w - 180, 20);

        // 更新状态
        var statusEl = document.getElementById('mapStatus');
        if (statusEl) {
            statusEl.textContent = '● ' + satCount + ' 颗卫星 · ' + modeText;
            statusEl.style.color = tleLoaded ? '#4caf50' : '#4dd0e1';
        }
    }

    // =========================================================
    // 重置视图
    // =========================================================
    function resetView() {
        drawOrbits();
    }

    // =========================================================
    // 初始化
    // =========================================================
    updateSatStats();
    updateISS();
    setTimeout(drawOrbits, 200);

    setInterval(updateSatStats, 60000);
    setInterval(updateISS, 5000);
    setInterval(drawOrbits, 3000);

    window.addEventListener('resize', function() {
        setTimeout(drawOrbits, 300);
    });

    console.log('🛰️ 太空域已加载 (轻量版)');
    console.log('📡 点击 "加载真实 TLE 数据" 获取真实卫星数据');
</script>
</body>
</html>
